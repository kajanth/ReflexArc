# ═══════════════════════════════════════════════
# ReflexArc Brain Configuration — MLOps / Data Pipeline
# ═══════════════════════════════════════════════
# Autonomous MLOps brain that monitors model performance,
# data drift, pipeline health, and training jobs.
#
# Usage: NSA_BRAIN_CONFIG=config/mlops.yaml python3 main.py

brain:
  name: "MLOps Brain"
  description: "Model monitoring, data drift detection, pipeline health, and training orchestration"
  heartbeat_interval: 30
  prediction_interval: 120
  goal_eval_interval: 300

sensors:
  - name: model_metrics
    module: plugins.sensors.mlops.ModelMetricsSensor
    args:
      prometheus_url: "http://prometheus:9090"
      models: ["recommendation-v3", "fraud-detector", "churn-predictor"]
      metrics: ["accuracy", "latency_p99", "throughput"]
    emoji: "📈"
    label: "Model Metrics"
    type: peripheral

  - name: data_drift
    module: plugins.sensors.mlops.DataDriftSensor
    args:
      reference_path: "/data/reference_stats.json"
      psi_threshold: 0.2
      check_interval: 300
    emoji: "🌊"
    label: "Data Drift"
    type: peripheral

  - name: pipeline_health
    module: plugins.sensors.mlops.PipelineHealthSensor
    args:
      airflow_url: "http://airflow:8080/api/v1"
      critical_dags: ["feature_pipeline", "training_daily", "batch_inference"]
    emoji: "🔧"
    label: "Pipeline Health"
    type: peripheral

  - name: gpu_cluster
    module: plugins.sensors.mlops.GPUClusterSensor
    args:
      cluster_api: "http://k8s-api:6443"
      gpu_utilization_threshold: 90
    emoji: "🖥️"
    label: "GPU Cluster"
    type: peripheral

  - name: data_quality
    module: plugins.sensors.mlops.DataQualitySensor
    args:
      great_expectations_url: "http://ge-server:5050"
    emoji: "✅"
    label: "Data Quality"
    type: peripheral

  - name: experiment_tracker
    module: plugins.sensors.mlops.ExperimentSensor
    args:
      mlflow_url: "http://mlflow:5000"
    emoji: "🧪"
    label: "Experiment Tracker"
    type: peripheral

  - name: circadian
    source: brain.circadian
    emoji: "⏰"
    label: "Training Schedule"
    type: internal

  - name: cognitive_load
    source: brain.cognitive_load
    emoji: "📊"
    label: "Cognitive Load"
    type: internal

predictions:
  - name: model_accuracy
    measurer: plugins.measurers.mlops.get_accuracy
    threshold: 0.85
    direction: below
    unit: ""
    description: "Model Accuracy"

  - name: inference_latency
    measurer: plugins.measurers.mlops.get_p99_latency
    threshold: 200
    direction: above
    unit: "ms"
    description: "Inference P99 Latency"

  - name: gpu_utilization
    measurer: plugins.measurers.mlops.get_gpu_util
    threshold: 95
    direction: above
    unit: "%"
    description: "GPU Utilization"

  - name: data_freshness
    measurer: plugins.measurers.mlops.get_data_age_hours
    threshold: 24
    direction: above
    unit: "hrs"
    description: "Data Freshness"

  - name: training_cost
    measurer: plugins.measurers.mlops.get_daily_training_cost
    threshold: 500
    direction: above
    unit: "$"
    description: "Daily Training Cost"

custom_measurers:
  - name: model_accuracy
    module: plugins.measurers.mlops.get_accuracy
  - name: inference_latency
    module: plugins.measurers.mlops.get_p99_latency
  - name: data_freshness
    module: plugins.measurers.mlops.get_data_age_hours
  - name: training_cost
    module: plugins.measurers.mlops.get_daily_training_cost
